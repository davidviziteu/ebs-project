syntax = "proto3";

message Publication {
	string pubId = 1;
	string stationid = 2;
	string city = 3;
	string temp = 4;
	string wind = 5;
}

message DeliveryEnvelope {
	string deliveryId = 1;
	string pubId = 2;
	string subId = 3;
	string ownerBrokerId = 4;
	string targetNotifierId = 5;
	int64 seqNo = 6;
	bytes publicationData = 7;
}

message DeliveryAck {
	string deliveryId = 1;
	string ownerBrokerId = 2;
	string notifierId = 3;
	int64 ackTimestamp = 4;
}

message BrokerReplication {
	enum ReplicationType {
		SUBSCRIPTION = 0;
		PENDING_DELIVERY = 1;
		DELIVERY_ACK = 2;
		CHECKPOINT = 3;
		HEARTBEAT = 4;
	}

	ReplicationType type = 1;
	string sourceBrokerId = 2;
	string targetBrokerId = 3;
	int64 timestamp = 4;
	string key = 5;
	bytes payload = 6;
}

message Heartbeat {
	string sourceBrokerId = 1;
	string targetBrokerId = 2;
	int64 timestamp = 3;
	int64 seqNo = 4;
}