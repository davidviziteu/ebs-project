syntax = "proto3";

message Subscription {
	message FieldSubscription {
        string key = 1;
        string operator = 2;
        string value = 3;
    }

    string subId = 1;
    string subscriberId = 2;
    string ownerBrokerId = 3;
    int64 createdAt = 4;
    repeated FieldSubscription fieldSubscriptions = 5;
}